name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# gitleaks scans the commits each push or pull request brings in (the full history was clean when it
# was added); Trivy scans Pipfile.lock for fixable HIGH/CRITICAL vulnerabilities and the tree for
# secrets, as daikon-gen3 does. Accepted findings live in .trivyignore with a reason, nowhere else.
jobs:
  gitleaks:
    name: gitleaks — incoming commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # on a pull request the action lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action scans the commits of this push or pull request, so it needs their parents
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy — lockfile & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
